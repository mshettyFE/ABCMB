[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ABCMB"
description = "A fast, differentiable, and extensible CMB code"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
keywords = ["cosmology", "differentiable", "CMB", "physics", "JAX"]
requires-python = ">=3.11"
dynamic = ["version"]

authors = [
    { name = "Zilu Zhou" },
    { name = "Cara Giovanetti", email = "cgiovanetti@lbl.gov" },
    { name = "Hongwan Liu" },
]

classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "diffrax",
    "equinox==0.13.2",
    "interpax",
    "jax==0.8.1",
    "optimistix==0.0.11",
    "tomlkit",
]

[project.optional-dependencies]
test = [
    "pytest",
    "classy",
]
dev = [
    "ruff==0.15.20",
    "pre-commit",
    "pyright==1.1.411",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
# CUDA-enabled jaxlib for the same pinned jax (needs an NVIDIA driver).
# Note: the companion solvers (HyRex/LINX) are CPU-pinned regardless --
# measured 29x faster on CPU than an RTX 4070 for the recombination solve --
# so this extra serves the main pipeline (perturbations/spectra) and
# benchmarking, not the companions.
gpu = [
    "jax[cuda12]==0.8.1",
]

[project.urls]
Homepage = "https://github.com/TonyZhou729/ABCMB"

[project.scripts]
abcmb = "abcmb.cli:main"

[tool.setuptools.dynamic]
version = { attr = "abcmb.version.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["abcmb", "abcmb.*"]

[tool.setuptools.package-data]
abcmb = [
    "bessel_tab/*.txt",
    "hyrex/tabs/*.dat",
    "linx/data/*",
    "linx/data/background/*.txt",
    "linx/data/nuclear_rates/key_PRIMAT_2018/*.txt",
    "linx/data/nuclear_rates/key_PRIMAT_2023/*.txt",
    "linx/data/nuclear_rates/key_YOF/*.txt",
    "linx/data/nuclear_rates/other_PRIMAT_2023/*.txt",
    "linx/data/weak_thermal_corrections/*.txt",
    "sBBN_2025_CLASS.txt",
]

[tool.ruff]
target-version = "py311"
# linx/ and hyrex/ are vendored companion codes (LINX, HyRex); leave them to
# their upstreams rather than reformatting/linting to ABCMB's rules.
# example_notebooks/ are pedagogical; don't reformat teaching material.
extend-exclude = [
    "abcmb/linx",
    "abcmb/hyrex",
    "example_notebooks",
    "abcmb/inputs/_schema_types.py",  # generated from the schema
]

[tool.ruff.lint]
# Ruff defaults (pyflakes F + pycodestyle E4/E7/E9) plus import sorting (I).
extend-select = ["I"]
# `l` is the standard multipole-moment symbol throughout this CMB code
# (the Output.l attribute, etc.), so don't flag it as an ambiguous name.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Sphinx conf.py must manipulate sys.path before importing the package for
# autodoc, so module-level imports legitimately follow other statements.
"docs/conf.py" = ["E402"]
# jaxtyping shape strings (Float[Array, "num_mu num_ell"]) are not forward
# type references, but ruff parses them as such; jaxtyping's FAQ says to
# disable F722 (pyright understands the annotations natively). Scoped to the
# files using shaped annotations rather than turned off project-wide.
"abcmb/ABCMBTools.py" = ["F722"]
"abcmb/model_setup.py" = ["F722"]
"abcmb/perturbations.py" = ["F722"]
"abcmb/recomb_interface.py" = ["F722"]
"abcmb/background.py" = ["F722"]
"abcmb/reionization.py" = ["F722"]

[tool.pyright]
# Type-check ABCMB's own code; vendored companion codes (LINX, HyRex) and
# pedagogical notebooks follow their upstreams (mirrors the ruff excludes).
include = ["abcmb"]
exclude = ["abcmb/linx", "abcmb/hyrex", "example_notebooks", "**/__pycache__"]
pythonVersion = "3.11"
# `basic` catches real errors (undefined names, TypedDict key typos, bad calls)
# without the strict-mode "unknown type" flood on an un-annotated JAX codebase.
typeCheckingMode = "basic"
# jax/diffrax/hyrex ship no stubs -- don't let that drown the signal.
reportMissingTypeStubs = false
reportMissingModuleSource = false
# jax/equinox ship loose type info; these rules are dominated by false positives on
# the numerics -- Array | tuple[Array,...] unions (operator/argument/index/optional),
# filter_jit's backend passthrough kwarg (call), and jax.checkpoint's export gap.
# The high-signal rules (reportGeneralTypeIssues / reportAttributeAccessIssue /
# reportInvalidTypeForm) stay on to catch real typos.
# Params is total=False by design (conditional inputs stay absent to signal
# intent; derived keys are added in stages by derive_parameters), so "key may
# be missing" on every access is noise. Key-NAME typos are still caught by
# reportGeneralTypeIssues ("not a defined key").
reportTypedDictNotRequiredAccess = "none"
reportOperatorIssue = "none"
reportArgumentType = "none"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportIndexIssue = "none"
reportCallIssue = "none"
reportPrivateImportUsage = "none"
