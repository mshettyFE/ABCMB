# ABCMB default configuration -- every option and parameter with its schema default.
#
# Tables are topical (grouped by schema 'group'). On load (model_from_config or
# `abcmb --config`) keys route to options vs params by *name*, so a key's table
# is purely for human readability; each key is tagged (param) or (option) below.
#
# Omitted (no fixed default):
#   conditional inputs (supplied only when needed): Neff / N_nu_massless / T_nu_massless / Delta_Neff_init / tau_n_fac / nuclear_rates_q
#   derived at runtime (computed, not inputs):      H0 / omega_m / R_b / omega_r / R_nu / om / omega_Lambda
# NOTE: Providing derived values on the CLI will get overridden
#
# Usage:  abcmb --config defaults.toml -o out.npz
#         from abcmb import model_from_config
#         model, params = model_from_config('defaults.toml')

[cosmology]
h = 0.6736              # (param, float) Dimensionless Hubble parameter H0/100.
omega_cdm = 0.12        # (param, float) Physical CDM density Omega_cdm h^2.
omega_b = 0.02237       # (param, float) Physical baryon density Omega_b h^2.
TCMB0 = 0.000234865418  # (param, float) CMB temperature today, in eV.
YHe = 0.245             # (param, float) Primordial helium mass fraction (n_He/(n_He+n_H)). Tacitly assuming no other species are produced in meaningful amounts (overwritten when bbn_type computes it).

[primordial]
A_s = 2.1e-09   # (param, float) Scalar amplitude at the pivot scale.
n_s = 0.9649    # (param, float) Scalar spectral index.
k_pivot = 0.05  # (option, float) Primordial pivot scale (Mpc^-1).

[reionization]
Delta_z_reion = 0.5     # (param, float) Reionization width in redshift.
z_reion_He = 3.5        # (param, float) Helium reionization redshift.
Delta_z_reion_He = 0.5  # (param, float) Helium reionization width.
exp_reion = 1.5         # (param, float) Reionization exponent.
tau_reion = 0.0544      # (param, float) Reionization optical depth (used when input_tau_reion is True).
z_reion = 7.67          # (param, float) Reionization redshift (used when input_tau_reion is False).

[neutrinos]
T_nu_massive = 0.71611  # (param, float) Massive-neutrino temperature (ratio to TCMB).
N_nu_massive = 0        # (param, int) Number of massive neutrinos.
m_nu_massive = 0.06     # (param, float) Massive-neutrino mass, in eV.

[species]
use_LCDM_species = true  # (option, bool) Include the default LCDM species set.
gauge = "synchronous"    # (option, str) Gauge the perturbations are integrated in: 'synchronous' or 'newtonian'. The per-species delta/theta in the PerturbationTable are not the same between the two. Note the *_PE solver tolerances are tuned for synchronous gauge and are not converged in newtonian gauge -- Model warns and names the values to use.

[input]
input_tau_reion = true  # (option, bool) Reionization input mode: tau_reion (True) vs z_reion (False).

[output]
l_min = 2                       # (option, int) Minimum multipole for output spectra.
l_max = 2500                    # (option, int) Maximum multipole for output spectra.
lensing = false                 # (option, bool) Compute lensed spectra.
lensing_buffer = 500            # (option, int) Multipoles of unlensed spectrum computed beyond l_max. The lensing convolution mixes neighbouring multipoles, so lensed Cls at l_max need unlensed power above it.
lensing_quadrature_buffer = 70  # (option, int) Extra Gauss-Legendre nodes above the padded l range for the correlation function -> Cl integral. At least 1 is required for exactness (the integrand reaches degree 2*l_max); more is precision margin.
k_max = 0.5                     # (option, float) Maximum wavenumber for the matter power spectrum (Mpc^-1).

[bbn]
bbn_type = ""                          # (option, str) BBN backend: '' / 'Table' (sBBN table) or 'linx' (LINX).
linx_reaction_net = "key_PRIMAT_2023"  # (option, str) LINX nuclear reaction network.

[hierarchy]
l_max_g = 12            # (option, int) Photon temperature hierarchy cutoff (min 4: delta/theta/sigma/F3 are named modes, so the truncation slot starts at l=4).
l_max_pol_g = 10        # (option, int) Photon polarization hierarchy cutoff (min 3: the Thomson source spans G0..G2, so the truncation slot starts at l=3).
l_max_massless_nu = 17  # (option, int) Massless-neutrino hierarchy cutoff.
l_max_massive_nu = 17   # (option, int) Massive-neutrino hierarchy cutoff.

[k_grid]
k_step_sub = 0.05             # (option, float) Perturbation k-grid step, sub-horizon.
k_step_super = 0.002          # (option, float) Perturbation k-grid step, super-horizon.
k_step_transition = 0.2       # (option, float) Perturbation k-grid transition step.
k_step_super_reduction = 0.1  # (option, float) Super-horizon step reduction factor.
k_lensing_extension = 0.3     # (option, float) Extra k range beyond the CMB grid for lensing-kernel coverage, in 1/Mpc; calibrated for lensing_ellmax ~ 3000 -- increase for l_max > 2500.
k_step_extension = 0.005      # (option, float) Linear step for the beyond-CMB k extension (lensing / user k_max), in 1/Mpc -- absolute units, unlike k_step_sub/super (units of k_rec).
k_min_tau0 = 0.1              # (option, float) Minimum k*tau0 for the perturbation grid.
k_max_tau0_over_l_max = 1.8   # (option, float) Max k*tau0 / l_max for the perturbation grid.
H0_fid = 0.000225556          # (option, float) Fiducial H0 for k-grid scaling, in 1/Mpc (c=1): 100*h/c with h=0.6762.
tau0_fid = 14186.68           # (option, float) Fiducial conformal time today for k-grid scaling.
rs_rec_fid = 144.6279         # (option, float) Fiducial sound horizon at recombination.

[transfer]
k_transfer_linstep = 0.45   # (option, float) Transfer-integration k-grid linear step.
k_transfer_logstep = 170.0  # (option, float) Transfer-integration k-grid log step.
tau_rec_fid = 281.040565    # (option, float) Fiducial conformal time at recombination.

[ic]
R_tc = 0.0015                     # (option, float) Tight-coupling threshold for IC start time.
R_large = 0.07                    # (option, float) Large-scale threshold for IC start time.
transfer_start_threshold = 0.008  # (option, float) aH*tau_c value defining the transfer start time (smaller = earlier start; the initial conditions assume tight coupling).

[solver]
max_steps_PE = 2048        # (option, int) Max diffrax steps for the perturbation evolver.
k_batch_strategy = "auto"  # (option, str) k-mode batching: 'scan' (sequential, minimal total work; best on CPU), 'vmap' (lockstep batch; best on GPU), 'auto' (pick by JAX backend). The two paths differ at solver-tolerance level (adaptive steps).
lna_tau_points = 10000     # (option, int) Points of the conformal-time tabulation grid (lna in [-33, 0]).
lna_output_points = 500    # (option, int) Time-grid points of the perturbation output table (transfer start to today); source integrations interpolate from this grid.
lna_lensing_points = 500   # (option, int) Time-grid points of the lensing-potential Cl integration (recombination to today; used only when lensing=True).
k_split_PE = 0.01          # (option, float) k threshold splitting solver tolerances.
rtol_small_k_PE = 1e-05    # (option, float) Relative tolerance, small k. this band controls the low multipoles
rtol_large_k_PE = 0.0001   # (option, float) Relative tolerance, large k. Controls errors for l > ~100 .
atol_small_k_PE = 1e-10    # (option, float) Absolute tolerance, small k.
atol_large_k_PE = 1e-06    # (option, float) Absolute tolerance, large k. Tighten together with rtol_large_k_PE (see there).
pcoeff_PE = 0.25           # (option, float) PID controller P coefficient.
icoeff_PE = 0.8            # (option, float) PID controller I coefficient.
dcoeff_PE = 0.0            # (option, float) PID controller D coefficient.

[source]
scale_sw = 1.0   # (option, float) Sachs-Wolfe term switch/scale.
scale_isw = 1.0  # (option, float) Integrated Sachs-Wolfe term switch/scale.
scale_dop = 1.0  # (option, float) Doppler term switch/scale.
scale_pol = 1.0  # (option, float) Polarization term switch/scale.
