name: Run Tests

# Runs on every branch, not just main: the pre-push hook only runs the fast
# suite, so the slow CLASS accuracy comparisons and the notebooks are checked
# here. Without this, work on a feature branch has no server-side gate at all.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the commit-stage hooks (ruff lint + format). The pre-push pytest
      # hook is excluded here; tests run in the `build` job below.
      - name: Run pre-commit (lint + format)
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Cache pyright's bundled Node
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyright-python
          key: pyright-node-${{ runner.os }}

      # Type errors gate the build. jax/equinox stub-noise rules are suppressed in
      # [tool.pyright]; the high-signal rules (TypedDict keys, attribute access,
      # invalid type forms) catch real typos.
      - name: Type check (pyright)
        run: uv run --extra dev pyright

  docs:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORM_NAME: "cpu"  # autodoc imports abcmb, which imports JAX
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # -W turns Sphinx warnings into errors: stale autodoc references, orphaned
      # pages, and broken cross-links fail CI instead of rotting silently.
      - name: Build docs (warnings are errors)
        run: uv run --extra docs sphinx-build -W -b html docs docs/_build/html

  build:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORM_NAME: "cpu"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      XLA_FLAGS: "--xla_cpu_enable_fast_math=false"
      JAX_ENABLE_X64: "true"
      # JAX_DISABLE_JIT: "1"
      JAX_DEBUG_NANS: "false"
      JAX_TRACEBACK_FILTERING: "off"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test --python ${{ matrix.python-version }}

      # -p pytest_cov is required: PYTEST_DISABLE_PLUGIN_AUTOLOAD (above) keeps
      # the run deterministic by not autoloading installed plugins, so coverage
      # must be requested by name or it silently does nothing.
      - name: Run tests
        run: >
          uv run --python ${{ matrix.python-version }}
          pytest -s -vv -p pytest_cov --cov --cov-report=term-missing pytests

  # The example notebooks are user-facing documentation with no static checker
  # behind them: ruff, pyright and the unit suite all pass on a notebook whose
  # cells raise. Executing them is the only thing that catches a stale cell,
  # so they run here -- on one Python version only, since each notebook is a
  # full solve and this is a documentation check, not a physics one.
  notebooks:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: "cpu"
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      # The explicit path overrides testpaths (= pytests) from pyproject.toml.
      # --nbmake-timeout guards a hung kernel; nbmake has no default timeout.
      - name: Execute example notebooks
        run: uv run pytest --nbmake --nbmake-timeout=1800 example_notebooks
