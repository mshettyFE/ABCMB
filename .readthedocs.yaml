# .readthedocs.yaml
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

# Install the package itself (autodoc imports it) plus the sphinx toolchain,
# both from pyproject.toml -- the single source of truth for docs deps.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
  - epub
